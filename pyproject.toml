[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# texto das vagas fictícias em linhas longas, para ler como o feed
"eval/gerar_sinteticas.py" = ["E501"]
